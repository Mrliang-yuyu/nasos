server {
    listen 80 default_server;
    listen [::]:80 default_server;

    root /opt/lingyue/www;
    index index.html;

    server_name _;

    location /api/ {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
